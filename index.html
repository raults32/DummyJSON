<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller 10</title>
  </head>
  <body>
    <main>
      <form id="loginForm">
        <h1>Inicia Sesion</h1>
        <label for="username">Usuario:</label>
        <input
          type="text"
          id="username"
          name="username"
          value="emilys"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          value="emilyspass"
          required
        />

        <button type="submit" id="enviar">Iniciar Sesion</button>
        <p id="error" role="alert"></p>
      </form>

      <section id="contenido" hidden>
        <h2>Mi perfil</h2>

        <img id="foto" src="" alt="Foto de perfil" width="100" />

        <p>Nombre: <span id="nombre"></span></p>
        <p>Correo: <span id="correo"></span></p>
        <p>Usuario: <span id="usuario"></span></p>
        <p>Edad: <span id="edad"></span></p>

        <h2>Mis tareas</h2>

        <div>
          <p>Total: <span id="totalTareas">0</span></p>
          <p>Completadas: <span id="tareasCompletadas">0</span></p>
          <p>Pendientes: <span id="tareasPendientes">0</span></p>
          <p>Progreso: <span id="progreso">0%</span></p>
        </div>

        <div>
          <label for="filtro">Filtrar tareas:</label>
          <select id="filtro">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
          </select>

          <label for="buscar">Buscar:</label>
          <input type="text" id="buscar" placeholder="Buscar tarea..." />
        </div>

        <ul id="listaTareas"></ul>

        <button id="cerrarSesion" type="button">Cerrar sesión</button>
      </section>

      <script src="app.js"></script>
    </main>
  </body>
</html>
