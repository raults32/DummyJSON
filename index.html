    <title>Taller 10</title>

  <body>
    <main>
      <h1>Taller 10</h1>
      <form method="post" id="loginForm">
        <label for="username">Usuario:</label>
        <input
          type="text"
          id="username"
          name="username"
          value="emilys"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          value="emilyspass"
          required
        />

        <button type="submit" id="enviar">Enviar</button>
      </form>

      <script src="app.js"></script>
    </main>
  </body>
